<style>
/* ============================================================
   ביבי קום!  —  single file arcade clicker
   Palette: night indigo → dawn peach, bed blue, alarm red, amber
   ============================================================ */

:root{
  --night-1:#0A0E26;
  --night-2:#161C46;
  --dawn-1:#3A2C5E;
  --dawn-2:#F0A464;
  --amber:#FFC24A;
  --amber-dim:#8A6320;
  --alarm:#E23A2E;
  --bed-blue:#5A8FCB;
  --cream:#F7F2E6;
  --ink:#0A0E26;

  --font: "Rubik", "Assistant", "Heebo", "Noto Sans Hebrew", "Arial Hebrew", system-ui, -apple-system, "Segoe UI", sans-serif;

  --rail-h: 108px;
  --hud-h: 78px;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

html,body{height:100%;}

body{
  font-family:var(--font);
  background:#05071A;
  color:var(--cream);
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
  display:flex; align-items:center; justify-content:center;
}

img{display:block; max-width:none; -webkit-user-drag:none; user-drag:none; pointer-events:none;}
/* a host page may ship img{max-width:100%}, which would fight our explicit sizes */
img, .bibi, .bub, .tool, .btn{-webkit-touch-callout:none;}

/* ---------- stage ---------- */
.stage{
  position:relative;
  width:100%;
  max-width:480px;
  height:100vh;              /* fallback only */
  height:100%;               /* the real one: exactly our container */
  min-height:340px;
  max-height:1000px;
  overflow:hidden;
  isolation:isolate;
  touch-action:none;
  background:linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 62%, #22285A 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.7);
}
/* dawn layer — brightens as the clock advances. Information, not decoration. */
.stage::before{
  content:"";
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0;
  background:linear-gradient(180deg, var(--dawn-1) 0%, #8E5B7A 45%, var(--dawn-2) 100%);
  opacity:var(--dawn,0);
  will-change:opacity;
  z-index:0;
}
/* soft floor glow under the bed */
.stage::after{
  content:"";
  position:absolute; left:50%; bottom:var(--rail-h); transform:translateX(-50%);
  width:120%; height:46%;
  background:radial-gradient(ellipse at center, rgba(255,194,74,.18), transparent 65%);
  opacity:calc(.25 + var(--dawn,0) * .75);
  will-change:opacity;
  pointer-events:none; z-index:0;
}

/* ---------- screens ---------- */
.screen{
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:2;
  display:none;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.screen.on{display:flex;}

/* ============================================================
   START SCREEN
   ============================================================ */
.start{
  align-items:center; justify-content:center;
  gap:26px; padding:28px 26px;
  text-align:center;
}
.start__logo{
  width:min(64vw, 260px); height:auto;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));
  animation:snooze 3.4s ease-in-out infinite;
}
@keyframes snooze{
  0%,100%{transform:translateY(0) rotate(-1.5deg);}
  50%{transform:translateY(-10px) rotate(1.5deg);}
}
.start__copy{display:flex; flex-direction:column; align-items:center; gap:12px;}
.start__tag{
  font-size:19px; font-weight:700; line-height:1.55;
  color:#EDEFFC; max-width:24ch;
}
.start__sub{
  font-size:13.5px; font-weight:400; line-height:1.65;
  color:#A8AFD8; max-width:32ch;
}
.start__tag b{color:var(--amber); font-weight:800;}
.start__actions{display:flex; flex-direction:column; gap:12px; width:min(100%, 300px);}
.credit{
  position:absolute; left:0; right:0;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  text-align:center;
  font-size:11px; font-weight:400; line-height:1;
  color:#7A82AC;
  pointer-events:none;
}

/* ---------- buttons ---------- */
.btn{
  touch-action:manipulation;
  font-family:inherit; font-size:19px; font-weight:800;
  border:none; border-radius:16px;
  padding:16px 22px;
  cursor:pointer;
  text-decoration:none;
  color:var(--ink);
  background:var(--amber);
  box-shadow:0 6px 0 #B07C15, 0 12px 22px rgba(0,0,0,.4);
  transition:transform .07s ease, box-shadow .07s ease;
}
.btn:active{transform:translateY(5px); box-shadow:0 1px 0 #B07C15, 0 5px 12px rgba(0,0,0,.4);}
.btn:focus-visible{outline:3px solid #fff; outline-offset:3px;}
.btn--ghost{
  background:transparent; color:var(--cream);
  box-shadow:inset 0 0 0 2px rgba(247,242,230,.35);
  font-size:17px; font-weight:600; padding:13px 22px;
}
.btn--ghost:active{transform:translateY(2px); box-shadow:inset 0 0 0 2px rgba(247,242,230,.5);}
.btn--wa{
  background:#25D366; box-shadow:0 6px 0 #128C46, 0 12px 22px rgba(0,0,0,.4); color:#04240F;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn--wa .wa-icon{width:23px; height:23px; flex:0 0 auto;}
.btn--wa:active{box-shadow:0 1px 0 #128C46, 0 5px 12px rgba(0,0,0,.4);}

@keyframes rise{from{transform:translateY(18px) scale(.96); opacity:0;} to{transform:none; opacity:1;}}

/* ============================================================
   HUD — the alarm clock slab
   ============================================================ */
.hud{
  position:relative; z-index:3;
  height:var(--hud-h); flex:0 0 auto;
  display:flex; align-items:center; flex-wrap:nowrap; gap:10px;
  padding:0 12px;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(6,9,28,.92), rgba(6,9,28,.55));
  border-bottom:1px solid rgba(255,255,255,.08);
}
.clock{
  flex:0 1 auto; min-width:0;
  display:flex; align-items:baseline; gap:6px;
  background:#06091C;
  border:2px solid rgba(255,194,74,.28);
  border-radius:12px;
  padding:8px 12px 7px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.9);
}
.clock__digits{
  font-size:clamp(20px, 7vw, 28px); font-weight:900; letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
  color:var(--amber);
  text-shadow:0 0 14px rgba(255,194,74,.55);
  direction:ltr;
}
.clock.urgent .clock__digits{color:#FF6B5B; text-shadow:0 0 16px rgba(255,80,60,.7); animation:tick .6s steps(2) infinite;}
@keyframes tick{50%{opacity:.45;}}

.meter{flex:1 1 auto; min-width:0;}
.meter__top{
  display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  font-size:12px; font-weight:700; color:#AEB5E0; margin-bottom:5px;
  white-space:nowrap;
}
.meter__top #stage-label{overflow:hidden; text-overflow:ellipsis;}
.meter__val{font-size:15px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums;}
.meter__track{
  height:16px; border-radius:99px;
  background:#080B22;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
.meter__fill{
  height:100%; width:0%;
  background:linear-gradient(90deg, hsl(var(--h,210) 70% 42%), hsl(var(--h,210) 92% 62%));
  box-shadow:0 0 12px hsl(var(--h,210) 92% 55% / .7);
}
.meter.pressured .meter__track{
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8), 0 0 0 1px rgba(226,58,46,.85);
}
.meter.hit .meter__track{animation:shakeBar .3s;}
@keyframes shakeBar{25%{transform:translateX(4px);}75%{transform:translateX(-4px);}}

/* share straight from the top bar, same footprint the mute button had */
.wa-mini{
  flex:0 0 auto; align-self:center;
  width:34px; height:34px; padding:0;
  border:none; border-radius:50%;
  background:#25D366;
  box-shadow:0 2px 0 #128C46, 0 4px 10px rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation;
  transition:transform .08s ease;
}
.wa-mini .wa-icon{width:20px; height:20px;}
.wa-mini{text-decoration:none;}
.wa-mini:active{transform:scale(.9);}

/* ============================================================
   FIELD — bed + bubbles
   ============================================================ */
.field{
  position:relative; z-index:2;
  flex:1 1 auto; min-height:0;
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.bibi{
  position:relative;
  touch-action:manipulation;
  will-change:transform;
  display:block;
  width:-webkit-fit-content;
  width:fit-content;
  flex:0 0 auto;
  padding:10px 20px;
  cursor:pointer;
  transform-origin:50% 85%;
}
.bibi img{
  height:var(--char-h, 280px);
  width:auto;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));
  opacity:calc(.84 + var(--wake,0) * .16);
  transition:opacity .25s linear;
}
/* instant confirmation ring under the finger */
.ring{
  position:absolute; z-index:13;
  width:58px; height:58px; margin:-29px 0 0 -29px;
  border-radius:50%;
  border:3px solid rgba(255,194,74,.9);
  pointer-events:none;
  animation:ringOut .34s ease-out forwards;
}
@keyframes ringOut{
  from{transform:scale(.35); opacity:.95;}
  to{transform:scale(1.6); opacity:0;}
}
.zzz{
  position:absolute; top:9%; inset-inline-start:6%;
  font-size:26px; font-weight:900; color:#BFD4F5;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  direction:ltr;
  opacity:calc(1 - var(--wake,0));
  animation:float 2.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-6deg); opacity:.55;}
  50%{transform:translateY(-14px) rotate(4deg); opacity:1;}
}

/* floating score popups */
.pop{
  position:absolute; z-index:12;
  font-size:22px; font-weight:900;
  color:#8DF08B; text-shadow:0 2px 6px rgba(0,0,0,.7);
  pointer-events:none;
  animation:popUp .75s ease-out forwards;
  direction:ltr;
}
.pop.bad{color:#FF7A6B;}
@keyframes popUp{
  0%{transform:translate(-50%,0) scale(.7); opacity:0;}
  25%{transform:translate(-50%,-14px) scale(1.15); opacity:1;}
  100%{transform:translate(-50%,-64px) scale(1); opacity:0;}
}

/* ---------- the mouthpieces ---------- */
.bub{
  position:absolute; z-index:10;
  touch-action:manipulation;
  cursor:pointer;
  animation:bubIn .2s cubic-bezier(.2,1.5,.5,1);
  will-change:transform, opacity;
}
@keyframes bubIn{from{transform:scale(.35); opacity:0;} to{transform:scale(1); opacity:1;}}
.bub__bg{
  width:100%; height:100%;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
.bub__fuse{
  position:absolute; left:4%; right:4%; bottom:-7px;
  height:4px; border-radius:99px;
  background:var(--alarm);
  box-shadow:0 0 8px rgba(226,58,46,.7);
  transform-origin:100% 50%;
  animation:fuse linear forwards;
}
@keyframes fuse{from{transform:scaleX(1);} to{transform:scaleX(0);}}
.bub.gone{animation:bubOut .22s ease-in forwards;}
@keyframes bubOut{to{transform:scale(1.5); opacity:0;}}
.bub.miss{animation:bubMiss .3s ease-in forwards;}
@keyframes bubMiss{to{transform:scale(.5) translateY(16px); opacity:0; filter:grayscale(1);}}

/* ============================================================
   RAIL — the nightstand of tools
   ============================================================ */
.rail{
  position:relative; z-index:3;
  height:var(--rail-h); flex:0 0 auto;
  display:flex; flex-direction:column; gap:5px;
  padding:6px 12px 10px;
  background:linear-gradient(180deg, rgba(6,9,28,.35), rgba(6,9,28,.95));
  border-top:1px solid rgba(255,255,255,.08);
}
.rail__label{
  flex:0 0 auto;
  font-size:10.5px; font-weight:700; color:#7F87B4;
  text-align:center; line-height:1;
}
.rail__grid{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
.tool{
  position:relative; overflow:hidden;
  touch-action:manipulation;
  border:none; border-radius:14px;
  background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:6px 4px 4px;
  cursor:pointer; font-family:inherit;
  transition:transform .08s ease, background .2s ease;
}
.tool:active{transform:scale(.95);}
.tool__img{height:44px; width:auto; object-fit:contain;}
.tool__name{font-size:10.5px; font-weight:700; color:#C6CCF0; white-space:nowrap;}
.tool__gain{
  position:absolute; top:4px; inset-inline-end:6px;
  font-size:11px; font-weight:900; color:#8DF08B; direction:ltr;
}
.tool__cd{
  position:absolute; top:0; right:0; bottom:0; left:0;
  background:rgba(6,9,28,.72);
  transform-origin:50% 100%;
  transform:scaleY(0);
  pointer-events:none;
}
.tool__lock{
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0;
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:rgba(6,9,28,.86);
  color:#8B92BE; font-size:12px; font-weight:800;
}
.tool.locked{cursor:default;}
.tool.locked .tool__lock{display:flex;}
.tool.locked .tool__img{filter:grayscale(1) opacity(.4);}
.tool.ready{background:rgba(255,194,74,.14); box-shadow:inset 0 0 0 1px rgba(255,194,74,.4);}
.tool.fresh{animation:unlockFlash .7s ease-out;}
@keyframes unlockFlash{
  0%{box-shadow:inset 0 0 0 2px #fff; background:rgba(255,194,74,.5);}
  100%{box-shadow:inset 0 0 0 1px rgba(255,194,74,.4); background:rgba(255,194,74,.14);}
}
.tool__lock small{font-size:9px; font-weight:600; opacity:.75;}

/* Nudge 1 — the analytics said 59% of players never pressed a tool at all.
   If stage 1 is under way and nothing has been tried, the first tile breathes. */
.tool.nudge{animation:nudge 1.05s ease-in-out infinite;}
@keyframes nudge{
  0%,100%{box-shadow:inset 0 0 0 1px rgba(255,194,74,.45); transform:scale(1);}
  50%{box-shadow:inset 0 0 0 2px rgba(255,194,74,1), 0 0 16px rgba(255,194,74,.6); transform:scale(1.04);}
}
/* Nudge 2 — tool users fired roughly 1.7 of the 4 shots a stage allows,
   so say out loud the moment a tile is usable again. */
.tool.pulse{animation:pulse .45s ease-out 2;}
@keyframes pulse{
  from{box-shadow:inset 0 0 0 2px rgba(255,194,74,.95), 0 0 14px rgba(255,194,74,.55);}
  to{box-shadow:inset 0 0 0 1px rgba(255,194,74,.4);}
}

/* screen flash on big events */
.fx{
  position:absolute; z-index:14; pointer-events:none;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));
}
.fx--hand{
  height:52%; bottom:0; left:6%;
  transform-origin:50% 100%;
  animation:fxHand .85s cubic-bezier(.32,1.2,.4,1) forwards;
}
@keyframes fxHand{
  0%  {transform:translate(0,70%) rotate(-24deg); opacity:0;}
  20% {transform:translate(18%,4%) rotate(-10deg); opacity:1;}
  38% {transform:translate(26%,-10%) rotate(4deg) scale(1.05);}
  52% {transform:translate(20%,3%) rotate(-6deg);}
  66% {transform:translate(26%,-8%) rotate(3deg);}
  80% {transform:translate(20%,6%) rotate(-5deg);}
  100%{transform:translate(0,78%) rotate(-22deg); opacity:0;}
}
.fx--phone{
  height:32%; top:10%; right:5%;
  transform-origin:50% 80%;
  animation:fxPhone .95s ease-out forwards;
}
@keyframes fxPhone{
  0%  {transform:scale(.35) rotate(0deg); opacity:0;}
  12% {transform:scale(1.12) rotate(-11deg); opacity:1;}
  22% {transform:scale(1) rotate(11deg);}
  32% {transform:scale(1.08) rotate(-13deg);}
  42% {transform:scale(1) rotate(13deg);}
  52% {transform:scale(1.08) rotate(-10deg);}
  62% {transform:scale(1) rotate(10deg);}
  74% {transform:scale(1.04) rotate(-6deg);}
  86% {transform:scale(1) rotate(4deg);}
  100%{transform:scale(.45) rotate(0deg); opacity:0;}
}
.fx--woman{
  height:44%; top:46%; left:50%;
  animation:fxWoman 2.4s cubic-bezier(.2,1.25,.3,1) forwards;
}
@keyframes fxWoman{
  0%  {transform:translate(-50%,-50%) scale(.15); opacity:0;}
  14% {transform:translate(-50%,-50%) scale(1.45) rotate(-2deg); opacity:1;}
  22% {transform:translate(-50%,-50%) scale(1.3) rotate(3deg);}
  30% {transform:translate(-50%,-50%) scale(1.42) rotate(-3deg);}
  38% {transform:translate(-50%,-50%) scale(1.32) rotate(2deg);}
  70% {transform:translate(-50%,-50%) scale(1.36) rotate(0deg); opacity:1;}
  100%{transform:translate(-50%,-50%) scale(.25); opacity:0;}
}

.toast{
  position:absolute; top:12px; left:50%;
  z-index:16; pointer-events:none;
  background:rgba(6,9,28,.92);
  border:1px solid rgba(255,194,74,.45);
  color:var(--amber);
  font-size:13px; font-weight:800;
  padding:8px 15px; border-radius:99px;
  animation:toastIn 1.9s ease-out forwards;
}
@keyframes toastIn{
  0%{opacity:0; transform:translate(-50%,-10px);}
  14%{opacity:1; transform:translate(-50%,0);}
  78%{opacity:1; transform:translate(-50%,0);}
  100%{opacity:0; transform:translate(-50%,-6px);}
}

/* ---------- stage-up card ---------- */
.stagecard{
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:40;
  display:none; align-items:center; justify-content:center;
  padding:24px;
  background:rgba(5,7,26,.88);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}
.stagecard.on{display:flex;}
.stagecard__box{
  width:100%; max-width:330px; text-align:center;
  background:linear-gradient(180deg,#251D52,#141943);
  border:2px solid rgba(255,194,74,.42);
  border-radius:24px;
  padding:22px 20px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.65);
  animation:stagePop .32s cubic-bezier(.2,1.45,.4,1);
}
@keyframes stagePop{from{transform:scale(.82); opacity:0;} to{transform:none; opacity:1;}}
.stagecard__title{font-size:31px; font-weight:900; color:var(--amber); text-shadow:0 3px 0 #A9700F; margin-bottom:12px;}
.stagecard__art{width:92px; height:92px; object-fit:contain; margin:0 auto 12px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.5)); animation:snooze 2.2s ease-in-out infinite;}
.stagecard__line{font-size:15px; line-height:1.6; color:#DCE0F5; margin-bottom:18px;}
.stagecard .btn{width:100%; font-size:17px;}

.flash{
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:20; pointer-events:none;
  background:#fff; opacity:0;
}
.flash.go{animation:fl .35s ease-out;}
@keyframes fl{0%{opacity:.55;} 100%{opacity:0;}}

/* ============================================================
   END SCREEN
   ============================================================ */
.end{
  align-items:center; justify-content:center;
  gap:16px; padding:26px 24px; text-align:center;
}
.end__art{
  width:min(58vw, 230px); height:auto;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.55));
  animation:rise .4s ease-out;
}
.end__title{font-size:34px; font-weight:900; line-height:1.1;}
.end__line{font-size:16px; font-weight:500; line-height:1.65; color:#DCE0F5; max-width:28ch;}
.end__actions{display:flex; flex-direction:column; gap:11px; width:min(100%,320px);}

.win .end__title{color:var(--amber); text-shadow:0 4px 0 #A9700F;}
.lose .end__title{color:#7FA6E8;}

@media (max-height:640px){
  :root{--rail-h:96px; --hud-h:68px;}
  .end__art{width:min(44vw,170px);}
  .end__title{font-size:28px;}
  .start__logo{width:min(52vw,200px);}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  .bub__fuse{animation:none; display:none;}
}
</style>

<div class="stage" id="stage">

  toolEverUsed:false,  // has the player discovered the tools at all?
  pendingStage:0,      // stage waiting behind the stage-up card
  outcome:null,
  lastFrame:0
};

/* ============================================================
   SOUND — tiny WebAudio blips, no assets
   ============================================================ */
let audioCtx = null, muted = false;
function ctx(){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type = "square", vol = 0.07, slideTo = null){
  if (muted) return;
  try{
    ctx();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }catch(e){ /* audio is a bonus, never a blocker */ }
}
// filtered white noise — the percussive half of the tool sounds
function noiseBurst(dur = 0.12, filterType = "lowpass", freq = 900, vol = 0.12, sweepTo = null){
  if (muted) return;
  try{
    const ac = ctx();
    const t0 = ac.currentTime;
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = filterType;
    filt.frequency.setValueAtTime(freq, t0);
    filt.Q.value = 1.2;
    if (sweepTo) filt.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt).connect(g).connect(ac.destination);
    src.start(t0);
  }catch(e){}
}

const sfx = {
  tap  : () => tone(220, 0.06, "square", 0.05, 340),
  pop  : () => tone(660, 0.09, "triangle", 0.09, 240),
  miss : () => tone(180, 0.22, "sawtooth", 0.07, 70),
  tool : () => tone(440, 0.14, "square", 0.08, 880),

  // --- one sound profile per tool ---
  // 1. דש המעיל — a physical thump plus the slap of fabric
  hand : () => {
    tone(155, 0.09, "sine", 0.13, 62);
    noiseBurst(0.10, "bandpass", 1900, 0.16, 700);
    setTimeout(() => noiseBurst(0.07, "highpass", 2600, 0.07), 70);
  },
  // 2. הקו האדום — two bursts of an old bell-phone trill
  phone: () => {
    for (let ring = 0; ring < 2; ring++){
      for (let i = 0; i < 8; i++){
        setTimeout(() => tone(i % 2 ? 1180 : 860, 0.045, "square", 0.075), ring * 430 + i * 48);
      }
    }
  },
  // 3. שרה — an intense rising shriek that clears the room
  woman: () => {
    tone(420, 0.75, "sawtooth", 0.09, 2700);
    setTimeout(() => tone(560, 0.6, "square", 0.055, 3100), 70);
    noiseBurst(0.55, "highpass", 1600, 0.09, 5200);
    setTimeout(() => noiseBurst(0.25, "bandpass", 3400, 0.07), 380);
  },
  stageUp: () => { [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.16,"square",0.09),i*95)); },
  fastFwd: () => tone(1200, 0.04, "square", 0.04),
  win  : () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,"square",0.09),i*110)); },
  lose : () => { [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.26,"sawtooth",0.08),i*160)); },
  unlock:() => { [659,880].forEach((f,i)=>setTimeout(()=>tone(f,0.14,"triangle",0.09),i*100)); }
};
/* ============================================================
   MUSIC — a looping chiptune bed, synthesised note by note.
   Deliberately quiet so the tap and pop effects stay on top.
   ============================================================ */
const MUSIC = {
  bpm  : 132,
  vol  : 0.085,                       // master level for the whole bed
  // four bars of Am - F - C - G
  bars : [
    { bass:110.00, chord:[440.00, 523.25, 659.25] },
    { bass: 87.31, chord:[349.23, 440.00, 523.25] },
    { bass:130.81, chord:[523.25, 659.25, 783.99] },
    { bass: 98.00, chord:[392.00, 493.88, 587.33] }
  ],
  arp      : [0,1,2,1, 0,1,2,1, 0,1,2,1, 2,1,0,1],  // sixteenths
  bassHits : [0,3,6,8,11,14],
  kickHits : [0,8],
  hatHits  : [2,6,10,14]
};

let musicGain = null, musicTimer = null, musicStep = 0, musicNext = 0, hatBuf = null;

function musicVoice(freq, time, dur, type, vol){
  const ac = audioCtx;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(g).connect(musicGain);
  osc.start(time); osc.stop(time + dur + 0.03);
}

function musicKick(time){
  const ac = audioCtx;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(45, time + 0.11);
  g.gain.setValueAtTime(0.75, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
  osc.connect(g).connect(musicGain);
  osc.start(time); osc.stop(time + 0.2);
}

function musicHat(time){
  const ac = audioCtx;
  if (!hatBuf){
    hatBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.06), ac.sampleRate);
    const d = hatBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  }
  const src = ac.createBufferSource(); src.buffer = hatBuf;
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7000;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.22, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  src.connect(f).connect(g).connect(musicGain);
  src.start(time);
}

function musicStepAt(step, time){
  const bar = MUSIC.bars[Math.floor(step / 16) % MUSIC.bars.length];
  const i = step % 16;
  if (MUSIC.bassHits.indexOf(i) >= 0) musicVoice(bar.bass, time, 0.17, "triangle", 0.55);
  if (MUSIC.kickHits.indexOf(i) >= 0) musicKick(time);
  if (MUSIC.hatHits.indexOf(i) >= 0)  musicHat(time);
  musicVoice(bar.chord[MUSIC.arp[i]], time, 0.1, "square", 0.3);
}

function musicScheduler(){
  const ac = audioCtx;
  if (!ac || !musicGain) return;
  const step = 60 / MUSIC.bpm / 4;
  let guard = 0;
  while (musicNext < ac.currentTime + 0.15 && guard++ < 64){
    musicStepAt(musicStep++, musicNext);
    musicNext += step;
  }
}

// called from the first real tap, so the browser lets the audio through
function startMusic(){
  if (musicTimer || muted) return;
  try{
    const ac = ctx();
    if (!ac) return;
    musicGain = ac.createGain();
    musicGain.gain.value = MUSIC.vol;
    musicGain.connect(ac.destination);
    musicStep = 0;
    musicNext = ac.currentTime + 0.12;
    musicTimer = setInterval(musicScheduler, 25);
    musicScheduler();
  }catch(e){ /* no audio on this device: the game plays on in silence */ }
}

function buzz(ms){ if (!muted && navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} } }



/* ============================================================
   HELPERS
   ============================================================ */
function show(name){
  Object.values(screens).forEach(s => s.classList.remove("on"));
  screens[name].classList.add("on");
}
function fmtClock(totalMinutes){
  const m = Math.floor(totalMinutes);
  const h = Math.floor(m / 60) % 24;
  const mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}
// 6:13 rather than 06:13, the way the victory line reads it out
function fmtShort(totalMinutes){ return fmtClock(totalMinutes).replace(/^0/, ""); }
// The clock runs faster than real time: each stage covers STAGE_MINUTES of
// clock in STAGE_LEN seconds, so 13s of play spans 05:00 → 05:30.
const CLOCK_RATE = CFG.STAGE_MINUTES / CFG.STAGE_LEN;
function clockMinutes(seconds){
  return CFG.START_MINUTE + Math.min(seconds, CFG.DURATION) * CLOCK_RATE;
}
function currentClock(){ return fmtClock(clockMinutes(S.t)); }
const rand = (a,b) => a + Math.random() * (b - a);

function floatText(text, x, y, bad){
  const live = field.querySelectorAll(".pop");
  if (live.length > 7) live[0].remove();          // fast tapping must not pile up nodes
  const el = document.createElement("span");
  el.className = "pop" + (bad ? " bad" : "");
  el.textContent = text;
  el.style.left = x + "px";
  el.style.top  = y + "px";
  field.appendChild(el);
  el.addEventListener("animationend", () => el.remove(), { once:true });
  setTimeout(() => el.remove(), 1200);
}

/* ============================================================
   WAKEFULNESS
   ============================================================ */
function addWake(amount){
  S.wake = Math.max(0, Math.min(100, S.wake + amount));
  renderMeter();
  if (S.wake >= 100 && S.running){
    if (S.stage < CFG.STAGES) completeStage();
    else endGame(true);
  }
}
// The loop runs 60x a second. Every style write here used to cost a repaint of
// the character and both full-screen tint layers, which is what made taps feel
// laggy. Now each property is only written when it actually changes.
const paint = { w:-1, hue:-1, pct:-1, wake:-1, dawn:-1, clock:"" };

function renderMeter(){
  const p = S.wake;
  const w = Math.round(p * 4) / 4;
  if (w !== paint.w){ wakeFill.style.width = w + "%"; paint.w = w; }

  const hue = Math.round(210 - 168 * (p / 100));
  if (hue !== paint.hue){ wakeFill.style.setProperty("--h", hue); paint.hue = hue; }

  const pct = Math.floor(p);
  if (pct !== paint.pct){ wakeVal.textContent = pct + "%"; paint.pct = pct; }

  const wake = Math.round(p / 5) * 5 / 100;   // dim the character in 5% steps
  if (wake !== paint.wake){ stage.style.setProperty("--wake", wake); paint.wake = wake; }
}

function renderClock(seconds){
  const txt = fmtClock(clockMinutes(seconds));
  if (txt !== paint.clock){ digits.textContent = txt; paint.clock = txt; }
  const dawn = Math.round(Math.pow(seconds / CFG.DURATION, 2) * 100) / 100;
  if (dawn !== paint.dawn){ stage.style.setProperty("--dawn", dawn); paint.dawn = dawn; }
}

function renderStage(){
  const deadline = fmtClock(CFG.START_MINUTE + S.stage * CFG.STAGE_MINUTES);
  $("stage-label").textContent = "שלב " + S.stage + " עד " + deadline;
}

function toast(text){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  (screens.end.classList.contains("on") ? screens.end : field).appendChild(el);
  el.addEventListener("animationend", () => el.remove(), { once:true });
}

/* ============================================================
   STAGES — 100% clears a stage, it never wins the game outright
   ============================================================ */
const stageCard = $("stagecard");
let stageTimer = null;

// spin the clock up to the start of the next stage while the card is open
function fastForwardClock(target, done){
  const from = S.t, t0 = performance.now(), dur = 900;
  let lastTick = 0;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    const cur = from + (target - from) * eased;
    renderClock(cur);
    if (now - lastTick > 90){ lastTick = now; sfx.fastFwd(); }
    if (k < 1 && S.pendingStage) requestAnimationFrame(step);
    else { S.t = Math.max(S.t, target); done && done(); }
  })(t0);
}

function completeStage(){
  const next = S.stage + 1;
  S.running = false;
  S.pendingStage = next;
  clearBubbles(false);
  field.querySelectorAll(".fx").forEach(n => n.remove());

  track("stage_complete", { stage: S.stage, clock: currentClock() });
  const tool = TOOLS[next - 1];
  $("sc-title").textContent = "שלב " + next + " נפתח!";
  $("sc-art").src = ART[tool.img];
  $("sc-line").textContent = STAGE_LINES[next];
  $("sc-go").textContent = "המשך";
  stageCard.classList.add("on");
  sfx.stageUp(); buzz([30,50,30,50,80]);

  fastForwardClock((next - 1) * CFG.STAGE_LEN);
  clearTimeout(stageTimer);
  stageTimer = setTimeout(beginPendingStage, CFG.STAGE_PAUSE * 1000);
}

function beginPendingStage(){
  if (!S.pendingStage) return;
  clearTimeout(stageTimer);
  const next = S.pendingStage;
  S.pendingStage = 0;
  stageCard.classList.remove("on");

  S.stage = next;
  S.t = Math.max(S.t, (next - 1) * CFG.STAGE_LEN);
  S.wake = 0;
  S.cooldowns = [0,0,0];
  S.spawnAt = 0.8;
  S.warned = false;
  S.hold = 0;
  renderMeter(); renderStage(); renderRail();

  S.lastFrame = performance.now();
  S.running = true;
}

/* ============================================================
   CHARACTER TAPS
   ============================================================ */
// `void bibi.offsetWidth` forced a synchronous layout on every tap. The Web
// Animations API restarts the same motion without touching layout at all.
let joltAnim = null;
function jolt(){
  if (!bibi.animate) return;
  if (joltAnim) joltAnim.cancel();
  joltAnim = bibi.animate([
    { transform:"scale(1)" },
    { transform:"scale(1.075) rotate(-2.6deg)", offset:0.32 },
    { transform:"scale(.975) rotate(1.8deg)", offset:0.68 },
    { transform:"none" }
  ], { duration:170, easing:"ease-out" });
}

function ringAt(x, y){
  const live = field.querySelectorAll(".ring");
  if (live.length > 5) live[0].remove();
  const el = document.createElement("i");
  el.className = "ring";
  el.style.left = x + "px";
  el.style.top  = y + "px";
  field.appendChild(el);
  el.addEventListener("animationend", () => el.remove(), { once:true });
  setTimeout(() => el.remove(), 700);
}

bibi.addEventListener("pointerdown", (e) => {
  if (!S.running) return;
  e.preventDefault();
  addWake(CFG.TAP_GAIN);
  S.hold = CFG.DRAIN_HOLD;
  jolt();
  const r = field.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  ringAt(x, y);
  floatText("+" + CFG.TAP_GAIN + "%", x, y, false);
  sfx.tap();
}, { passive:false });

/* ============================================================
   EXCUSE BUBBLES
   ============================================================ */
// Bubbles live in the margin around the character, never on top of him,
// so tapping ביבי can never pop a bubble by accident.
function perimeterSpot(bw, bh){
  const fw = field.clientWidth, fh = field.clientHeight;
  const fr = field.getBoundingClientRect();
  const cr = bibi.getBoundingClientRect();
  const pad = 6, edge = 9;

  // the character's no-go box, in field coordinates
  const noGo = {
    l: cr.left  - fr.left - pad,
    r: cr.right - fr.left + pad,
    t: cr.top   - fr.top  - pad,
    b: cr.bottom - fr.top + pad
  };

  const bands = [];
  const push = (x0, x1, y0, y1) => {
    if (x1 > x0 && y1 > y0) bands.push({ x0, x1, y0, y1, area:(x1 - x0) * (y1 - y0) });
  };
  push(edge, noGo.l - bw, edge, fh - bh - edge);              // left of him
  push(noGo.r, fw - bw - edge, edge, fh - bh - edge);         // right of him
  push(edge, fw - bw - edge, edge, noGo.t - bh);              // above him
  push(edge, fw - bw - edge, noGo.b, fh - bh - edge);         // below him

  if (!bands.length){
    // pathological viewport — scatter along the top rather than cover him
    return { x: rand(edge, Math.max(edge + 1, fw - bw - edge)), y: rand(edge, edge + 30) };
  }

  const total = bands.reduce((sum, b) => sum + b.area, 0);
  const sample = () => {
    let roll = Math.random() * total;
    const band = bands.find(b => (roll -= b.area) <= 0) || bands[0];
    return { x: rand(band.x0, band.x1), y: rand(band.y0, band.y1) };
  };

  // Take the candidate that sits furthest from the bubbles already on screen,
  // so a new excuse never lands on top of one you are still reading.
  const live = [...S.bubbles].map(b => ({
    x: parseFloat(b.el.style.left) || 0,
    y: parseFloat(b.el.style.top) || 0,
    w: b.w || bw,
    h: b.h || bh
  }));
  if (!live.length) return sample();

  let best = null, bestGap = -Infinity;
  for (let i = 0; i < CFG.SPAWN_TRIES; i++){
    const c = sample();
    let gap = Infinity;
    for (const o of live){
      // how far apart the two boxes are; negative means they overlap
      const dx = Math.abs((c.x + bw / 2) - (o.x + o.w / 2)) - (bw + o.w) / 2;
      const dy = Math.abs((c.y + bh / 2) - (o.y + o.h / 2)) - (bh + o.h) / 2;
      gap = Math.min(gap, Math.max(dx, dy));
    }
    if (gap > bestGap){ bestGap = gap; best = c; }
    if (gap > 12) break;              // comfortably clear, no need to keep looking
  }
  return best;
}

function spawnBubble(){
  if (S.bubbles.size >= CFG.MAX_BUBBLES) return;

  const el = document.createElement("div");
  el.className = "bub";

  const face = TARGETS[Math.floor(Math.random() * TARGETS.length)];

  const img = document.createElement("img");
  img.className = "bub__bg";
  img.src = ART[face.img];
  img.alt = "";

  const fuse = document.createElement("i");
  fuse.className = "bub__fuse";
  fuse.style.animationDuration = CFG.BUBBLE_LIFE + "s";

  el.append(img, fuse);

  const bh = Math.max(CFG.TARGET_H_MIN, Math.min(CFG.TARGET_H_MAX, field.clientWidth * CFG.TARGET_H));
  const bw = bh * face.ratio;
  const spot = perimeterSpot(bw, bh);
  el.style.width  = bw + "px";
  el.style.height = bh + "px";
  el.style.left = spot.x + "px";
  el.style.top  = spot.y + "px";

  const bubble = { el, born:S.t, w:bw, h:bh };
  el.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    if (!S.running) return;
    popBubble(bubble, true);
  });

  field.appendChild(el);
  S.bubbles.add(bubble);
}

function popBubble(b, byPlayer){
  if (!S.bubbles.has(b)) return;
  S.bubbles.delete(b);
  b.el.style.pointerEvents = "none";
  b.el.classList.add(byPlayer ? "gone" : "miss");
  b.el.addEventListener("animationend", () => b.el.remove(), { once:true });
  setTimeout(() => b.el.remove(), 500);

  if (byPlayer){
    S.pops++;
    sfx.pop(); buzz(12);
  }else{
    addWake(-CFG.BUBBLE_PENALTY);
    const r = field.getBoundingClientRect();
    const br = b.el.getBoundingClientRect();
    floatText("-" + CFG.BUBBLE_PENALTY + "%", br.left - r.left + br.width / 2, br.top - r.top + br.height / 2, true);
    meterEl.classList.remove("hit"); void meterEl.offsetWidth; meterEl.classList.add("hit");
    sfx.miss(); buzz([18, 40, 18]);
  }
}

function clearBubbles(byPlayer){
  [...S.bubbles].forEach(b => {
    S.bubbles.delete(b);
    b.el.style.pointerEvents = "none";
    b.el.classList.add("gone");
    setTimeout(() => b.el.remove(), 400);
    if (byPlayer) S.pops++;
  });
}

/* ============================================================
   TOOLBAR
   ============================================================ */
const cdNodes = [], cdPaint = [], readyPaint = [], pulseTimer = [];
let nudgePaint = null, hintReported = false;

function buildRail(){
  rail.innerHTML = "";
  TOOLS.forEach((tool, i) => {
    const btn = document.createElement("button");
    btn.className = "tool locked";
    btn.type = "button";
    btn.dataset.i = i;
    btn.innerHTML =
      '<span class="tool__gain">+' + tool.gain + '%</span>' +
      '<img class="tool__img" src="' + ART[tool.img] + '" alt="">' +
      '<span class="tool__name">' + tool.name + '</span>' +
      '<span class="tool__cd"></span>' +
      '<span class="tool__lock">🔒<small>שלב ' + tool.stage + ' (' + tool.at + ')</small></span>';
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); useTool(i); });
    rail.appendChild(btn);
    cdNodes[i] = btn.querySelector(".tool__cd");
    cdPaint[i] = -1;
    readyPaint[i] = null;
  });
}

// the big on-field animation each tool plays over the character
function toolFX(tool){
  field.querySelectorAll(".fx--" + tool.id).forEach(n => n.remove());
  const el = document.createElement("img");
  el.className = "fx fx--" + tool.id;
  el.src = ART[tool.img];
  el.alt = "";
  field.appendChild(el);
  el.addEventListener("animationend", () => el.remove(), { once:true });
  setTimeout(() => el.remove(), 3000);
}

function useTool(i){
  if (!S.running || !S.unlocked[i] || S.cooldowns[i] > 0) return;
  const tool = TOOLS[i];
  S.cooldowns[i] = tool.cd;

  track("tool_used", { tool: tool.id, stage: S.stage });
  S.toolEverUsed = true;
  toolFX(tool);
  (sfx[tool.id] || sfx.tool)();

  if (tool.id === "hand")  buzz([12, 40, 12]);
  if (tool.id === "phone") buzz([20, 50, 20, 50, 20]);
  if (tool.id === "woman") buzz([70, 40, 140]);

  if (tool.clears){
    clearBubbles(true);
    flashEl.classList.remove("go"); void flashEl.offsetWidth; flashEl.classList.add("go");
  }

  addWake(tool.gain);
  S.hold = CFG.DRAIN_HOLD;
  jolt();
  floatText("+" + tool.gain + "%", field.clientWidth / 2, field.clientHeight * 0.62, false);
}

function renderRail(){
  const tiles = rail.children;
  for (let i = 0; i < TOOLS.length; i++){
    const tile = tiles[i];
    const justUnlocked = !S.unlocked[i] && S.stage >= TOOLS[i].stage;
    if (justUnlocked){
      S.unlocked[i] = true;
      tile.classList.remove("locked");
      tile.classList.add("fresh");
      setTimeout(() => tile.classList.remove("fresh"), 800);
      if (S.t > 0.5) sfx.unlock();
    }
    const cd = S.cooldowns[i];
    // the bar is quantised, but "ready" tracks the real value: rounding the
    // last sliver of cooldown down to 0 must not swallow the highlight
    const scale = Math.round((cd > 0 ? cd / TOOLS[i].cd : 0) * 50) / 50;
    if (scale !== cdPaint[i]){
      cdNodes[i].style.transform = "scaleY(" + scale + ")";
      cdPaint[i] = scale;
    }
    const ready = S.unlocked[i] && cd <= 0;
    if (ready !== readyPaint[i]){
      tile.classList.toggle("ready", ready);
      // coming off cooldown is the moment worth announcing
      if (ready && readyPaint[i] === false){
        tile.classList.add("pulse");
        clearTimeout(pulseTimer[i]);
        pulseTimer[i] = setTimeout(() => tile.classList.remove("pulse"), 1000);
      }
      readyPaint[i] = ready;
    }
  }

  // the first tile breathes until the player tries a tool, in stage 1 only
  const nudge = S.running && S.stage === 1 && !S.toolEverUsed && S.t >= CFG.HINT_AFTER;
  if (nudge !== nudgePaint){
    tiles[0].classList.toggle("nudge", nudge);
    nudgePaint = nudge;
    if (nudge && !hintReported){ hintReported = true; track("tool_hint_shown"); }
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function loop(now){
  requestAnimationFrame(loop);
  if (!S.running) return;

  const dt = Math.min(0.1, (now - S.lastFrame) / 1000);
  S.lastFrame = now;
  S.t += dt;

  // clock + dawn
  renderClock(S.t);
  const urgent = S.stage * CFG.STAGE_LEN - S.t < CFG.WARN_AT;
  if (urgent !== paint.urgent){ clockEl.classList.toggle("urgent", urgent); paint.urgent = urgent; }

  // drift back to sleep
  if (S.hold > 0) S.hold -= dt;
  // a tap buys a moment of relief from the background drift, but every excuse
  // still hanging in the air keeps pulling him under regardless
  const base = (S.hold <= 0) ? CFG.DRAIN_PER_SEC * CFG.STAGE_DRAIN[S.stage - 1] : 0;
  const fromBubbles = S.bubbles.size * CFG.BUBBLE_DRAIN;
  const drain = base + fromBubbles;
  if (drain > 0 && S.wake > 0){
    S.wake = Math.max(0, S.wake - drain * dt);
    renderMeter();
  }

  const left = S.stage * CFG.STAGE_LEN - S.t;
  if (!S.warned && left < CFG.WARN_AT){
    S.warned = true;
    toast("נשארו " + CFG.WARN_AT + " שניות לשלב " + S.stage);
  }

  // cooldowns + unlocks
  for (let i = 0; i < S.cooldowns.length; i++){
    if (S.cooldowns[i] > 0) S.cooldowns[i] = Math.max(0, S.cooldowns[i] - dt);
  }
  renderRail();

  const pressured = S.bubbles.size >= 2;
  if (pressured !== paint.pressured){
    meterEl.classList.toggle("pressured", pressured);
    paint.pressured = pressured;
  }

  // bubble spawning, tightening as 06:30 approaches
  S.spawnAt -= dt;
  if (S.spawnAt <= 0){
    spawnBubble();
    const base = CFG.SPAWN_BY_STAGE[S.stage - 1];
    S.spawnAt = Math.max(0.4, base + rand(-CFG.SPAWN_JITTER, CFG.SPAWN_JITTER));
  }

  // bubbles escaping
  [...S.bubbles].forEach(b => {
    if (S.t - b.born >= CFG.BUBBLE_LIFE) popBubble(b, false);
  });

  // running out of stage time is an instant loss — no free ride to the next stage
  if (S.running && !S.pendingStage && S.t >= S.stage * CFG.STAGE_LEN) endGame(false);
}
requestAnimationFrame((t) => { S.lastFrame = t; loop(t); });

/* ============================================================
   FLOW
   ============================================================ */
function startGame(){
  S.running = false;
  S.t = 0;
  S.wake = 0;
  S.pops = 0;
  S.spawnAt = CFG.SPAWN_FIRST;
  S.cooldowns = [0,0,0];
  S.unlocked = [false,false,false];
  S.stage = 1;
  S.warned = false;
  S.hold = 0;
  S.toolEverUsed = false;
  nudgePaint = null;
  hintReported = false;
  pulseTimer.forEach(clearTimeout);
  S.pendingStage = 0;
  S.outcome = null;

  clearTimeout(stageTimer);
  stageCard.classList.remove("on");
  clearBubbles(false);
  S.bubbles.clear();
  field.querySelectorAll(".bub, .pop, .fx, .toast").forEach(n => n.remove());

  buildRail();
  paint.w = paint.hue = paint.pct = paint.wake = paint.dawn = -1;
  paint.clock = ""; paint.urgent = undefined; paint.pressured = undefined;
  renderMeter();
  renderStage();
  renderRail();
  digits.textContent = "05:00";
  clockEl.classList.remove("urgent");
  stage.style.setProperty("--dawn", 0);

  show("game");
  fitStage();
  startMusic();
  track("game_start");
  S.lastFrame = performance.now();
  S.running = true;
  tone(880, 0.12, "square", 0.07);
}

function endGame(won){
  S.running = false;
  S.pendingStage = 0;
  clearTimeout(stageTimer);
  stageCard.classList.remove("on");
  S.outcome = won ? "win" : "lose";
  clearBubbles(false);
  field.querySelectorAll(".fx").forEach(n => n.remove());

  const finalClock = currentClock();
  const finalWake  = Math.floor(S.wake);

  S.finalClock = finalClock;
  S.finalWake  = won ? 100 : finalWake;

  const end = screens.end;
  end.classList.toggle("win", won);
  end.classList.toggle("lose", !won);

  if (won){
    $("end-art").src = ART["wake_up.png"];
    $("btn-again").textContent = "משחק נוסף";
    $("end-title").textContent = "הוא קם!";
    const won_at = Math.floor(clockMinutes(S.t));
    $("end-line").textContent = "אבל כבר " + fmtShort(won_at) + ", למה כזה מאוחר? אם זה היה ב-" +
                                fmtShort(won_at - 1) + " הכל היה נראה אחרת...";
    sfx.win();
  }else{
    $("end-art").src = ART["sleep.png"];
    $("btn-again").textContent = "ניסיון חדש";
    $("end-title").textContent = "הוא המשיך לישון...";
    $("end-line").textContent = "השעה " + finalClock + " והוא ישן, כל האחריות עליך. ניפגש בוועדת החקירה חחחח סתם לא תהיה כזאת";
    sfx.lose();
  }
  track(won ? "game_win" : "game_lose", {
    stage_reached: S.stage,
    clock: finalClock,
    wakefulness: S.finalWake,
    targets_popped: S.pops
  });
  buzz(won ? [40,60,120] : [200]);
  show("end");
}

// The link that travels with every share. Change this one line if the game
// moves to its own domain.
// ?v=2 is a cache-buster: WhatsApp had already cached this link while the
// preview image was missing, and it holds that result for days. The suffix
// makes it a URL it has never seen, so the preview renders straight away.
// Once the plain link's cache has expired it can be dropped.
const GAME_URL = "https://bibi-kum.remesor.workers.dev/?v=2";

function shareText(){
  if (S.outcome === "win"){
    return "הצלחתי להעיר את ביבי לפני 6:30!\u23f0\n" +
           "כנסו למשחק 'ביבי קום' ונראה אם תצליחו להעיר אותו לפני שיהיה מאוחר מדי: " + GAME_URL;
  }
  if (S.outcome === "lose"){
    return "לא הצלחתי להעיר את ביבי \ud83d\ude34 אבל למדתי ממנו להפיל את האחריות על אחרים, אז עכשיו תורכם.\n" +
           "כנסו למשחק 'ביבי קום' ונסו להעיר אותו: " + GAME_URL;
  }
  // mid-game, from the round button in the top bar
  return "תכף 6:30 והוא עדיין ישן! \u23f0\n" +
         "חושבים שתצליחו להעיר את ביבי בזמן כדי למנוע אסון?\n" +
         "כנסו לשחק ב'ביבי קום': " + GAME_URL;
}

/* ============================================================
   UI WIRING
   ============================================================ */
$("btn-start").addEventListener("click", startGame);
$("btn-again").addEventListener("click", startGame);
$("sc-go").addEventListener("click", beginPendingStage);
function shareLink(){
  return "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText());
}
function shareSource(){
  return S.outcome === "win" ? "win_screen" : S.outcome === "lose" ? "lose_screen" : "in_game";
}

// Refresh the href just before the tap opens it, so the message always matches
// the screen the player is on.
function armShare(el){
  const refresh = () => { el.href = shareLink(); };
  refresh();
  ["pointerdown", "touchstart", "mouseenter", "focus"].forEach(ev =>
    el.addEventListener(ev, refresh, { passive:true }));

  // If the frame refuses to open a new tab, nothing visible happens. Put the
  // message on the clipboard instead and say so, rather than leaving a dead tap.
  el.addEventListener("click", () => {
    track("share_click", { from: shareSource() });
    const before = Date.now();
    setTimeout(() => {
      if (document.hidden || Date.now() - before > 1200) return;   // it opened
      try{
        navigator.clipboard.writeText(shareText());
        toast("הטקסט הועתק — הדביקו בוואטסאפ");
      }catch(e){}
    }, 600);
  });
}
armShare($("btn-share"));
armShare($("btn-wa"));

// pause when the tab or app goes away, so the clock can't run in the background
document.addEventListener("visibilitychange", () => {
  try{
    if (audioCtx) document.hidden ? audioCtx.suspend() : audioCtx.resume();
  }catch(e){}
  if (document.hidden){
    S.wasRunning = S.running;
    S.running = false;
  }else if (S.wasRunning && S.outcome === null){
    S.lastFrame = performance.now();
    S.running = true;
  }
});

// block double-tap zoom and long-press menus on the play area
["gesturestart","contextmenu"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);

// Viewport units lie inside an embedded frame, so take the smallest height any
// of the browser's own measurements reports and lay the game out against that.
function fitStage(){
  const vv = window.visualViewport;
  const heights = [window.innerHeight, document.documentElement.clientHeight, vv && vv.height]
    .filter(n => typeof n === "number" && n > 150);
  if (heights.length) stage.style.height = Math.round(Math.min.apply(null, heights)) + "px";

  // the character is a share of the play area we actually ended up with
  const fh = field.clientHeight;
  if (fh > 0){
    const h = Math.max(150, Math.min(410, Math.round(fh * 0.56)));
    stage.style.setProperty("--char-h", h + "px");
  }
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);
if (window.visualViewport) window.visualViewport.addEventListener("resize", fitStage);
// an embedding frame often settles on its final size a beat after load
[0, 120, 400, 1000].forEach(d => setTimeout(fitStage, d));
fitStage();

renderMeter();
renderStage();
</script>
